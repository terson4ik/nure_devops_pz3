apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iris-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # REPLACE_REPO_URL підставляє scripts/06-deploy-app.sh зі змінної GIT_REPO_URL
    repoURL: REPLACE_REPO_URL
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: iris-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
