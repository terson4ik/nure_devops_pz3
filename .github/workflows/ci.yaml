name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Compile pipeline & validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipelines/requirements.txt

      - name: Compile Kubeflow pipeline
        run: python pipelines/iris_pipeline.py

      - name: Check Python syntax
        run: python -m py_compile app/main.py app/train.py pipelines/run_pipeline.py

      - uses: actions/upload-artifact@v4
        with:
          name: iris-pipeline
          path: pipelines/iris_pipeline.yaml

      - name: Render kustomize
        run: kubectl kustomize deploy > /tmp/rendered.yaml

      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary /tmp/rendered.yaml

      - name: Validate ArgoCD Application YAML
        run: python -c "import yaml; yaml.safe_load(open('argocd/application.yaml')); print('argocd/application.yaml OK')"

  image:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t iris-api:ci app

      - name: Smoke test
        run: |
          docker run -d --name iris -p 8000:8000 iris-api:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          RESP=$(curl -fs -X POST localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}')
          echo "$RESP"
          echo "$RESP" | grep -q setosa
          docker logs iris

  # CD (GitOps): публікація образу в GHCR та оновлення тегу в deploy/ -> ArgoCD підхоплює зміну.
  # Вмикається змінною репозиторію ENABLE_CD=true (пакет у GHCR має бути public).
  publish:
    name: Publish image & bump tag (GitOps)
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_CD == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build & push image to GHCR, update kustomization
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/iris-api"
          TAG="${GITHUB_SHA::7}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "${IMAGE}:${TAG}" app
          docker push "${IMAGE}:${TAG}"
          sed -i "s|newName: .*|newName: ${IMAGE}|; s|newTag: .*|newTag: \"${TAG}\"|" deploy/kustomization.yaml

      - name: Commit new tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/kustomization.yaml
          git commit -m "ci: deploy iris-api ${GITHUB_SHA::7} [skip ci]" || exit 0
          git push
